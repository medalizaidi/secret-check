version: 2.1

# ──────────────────────────────────────────────
# Orbs
# ──────────────────────────────────────────────
orbs:
  python: circleci/python@2.1.1

# ──────────────────────────────────────────────
# Parameters
# ──────────────────────────────────────────────
parameters:
  github_repo_url:
    type: string
    default: "https://github.com/medalizaidi/FI_Thnity.git"
  docker_image:
    type: string
    default: "dali124/fi-thnity"
  scan_depth:
    type: integer
    default: 50
  github_branch:
    type: string
    default: "master"

# ──────────────────────────────────────────────
# Executors
# ──────────────────────────────────────────────
executors:
  scanner:
    docker:
      - image: cimg/python:3.11
    resource_class: medium

# ──────────────────────────────────────────────
# Jobs
# ──────────────────────────────────────────────
jobs:
  scan_github_repo:
    executor: scanner
    steps:
      - checkout

      - run:
          name: Install TruffleHog
          command: |
            mkdir -p "$HOME/bin"
            curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
              | sh -s -- -b "$HOME/bin"
            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"
            trufflehog --version

      - run:
          name: Run TruffleHog on GitHub repo
          command: |
            mkdir -p scan_results
            echo "Scanning: << pipeline.parameters.github_repo_url >>"
            echo "Branch: << pipeline.parameters.github_branch >>"
            echo "Max depth: << pipeline.parameters.scan_depth >>"
            
            trufflehog git "<< pipeline.parameters.github_repo_url >>" \
              --json \
              --max-depth << pipeline.parameters.scan_depth >> \
              --no-update \
              --branch << pipeline.parameters.github_branch >> \
            | tee scan_results/github_scan.jsonl
            
            EXIT_CODE=$?
            echo "TruffleHog exit code: $EXIT_CODE"
            
            echo "--- SCAN SUMMARY ---"
            echo "Total lines output: $(wc -l < scan_results/github_scan.jsonl)"
            echo "Verified secrets found: $(grep -c '"Verified":true' scan_results/github_scan.jsonl || echo 0)"
            echo "Unverified secrets found: $(grep -c '"Verified":false' scan_results/github_scan.jsonl || echo 0)"
            echo "--------------------"
            
            if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 183 ]; then
              echo "ERROR: TruffleHog failed with exit code $EXIT_CODE"
              exit 1
            fi

      - store_artifacts:
          path: scan_results/github_scan.jsonl
          destination: github_scan.jsonl

      - persist_to_workspace:
          root: .
          paths:
            - scan_results/github_scan.jsonl

  scan_docker_image:
    executor: scanner
    steps:
      - checkout

      - setup_remote_docker:
          version: default

      - run:
          name: Install TruffleHog
          command: |
            mkdir -p "$HOME/bin"
            curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
              | sh -s -- -b "$HOME/bin"
            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"
            trufflehog --version

      - run:
          name: Docker login and scan
          command: |
            mkdir -p scan_results
            echo "Scanning Docker image: << pipeline.parameters.docker_image >>"
            
            # Login to Docker Hub (credentials from project env vars)
            echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
            
            trufflehog docker --image "<< pipeline.parameters.docker_image >>" \
              --json \
              --no-update \
            | tee scan_results/docker_scan.jsonl
            
            EXIT_CODE=$?
            echo "TruffleHog exit code: $EXIT_CODE"
            
            echo "--- SCAN SUMMARY ---"
            echo "Total lines output: $(wc -l < scan_results/docker_scan.jsonl)"
            echo "Verified secrets found: $(grep -c '"Verified":true' scan_results/docker_scan.jsonl || echo 0)"
            echo "Unverified secrets found: $(grep -c '"Verified":false' scan_results/docker_scan.jsonl || echo 0)"
            echo "--------------------"
            
            if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 183 ]; then
              echo "ERROR: TruffleHog failed with exit code $EXIT_CODE"
              exit 1
            fi

      - store_artifacts:
          path: scan_results/docker_scan.jsonl
          destination: docker_scan.jsonl

      - persist_to_workspace:
          root: .
          paths:
            - scan_results/docker_scan.jsonl

  store_and_export:
    executor: scanner
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Install Python deps
          command: pip install --quiet sqlite-utils

      - run:
          name: Merge JSONL files and load into SQLite
          command: |
            python scripts/load_to_sqlite.py \
              --github  scan_results/github_scan.jsonl \
              --docker  scan_results/docker_scan.jsonl \
              --db      scan_results/trufflehog.db

      - run:
          name: Print summary
          command: python scripts/print_summary.py --db scan_results/trufflehog.db

      - store_artifacts:
          path: scan_results/trufflehog.db
          destination: trufflehog.db

      - store_artifacts:
          path: scan_results
          destination: scan_results

workflows:
  trufflehog_scan:
    jobs:
      - scan_github_repo
      - scan_docker_image
      - store_and_export:
          requires:
            - scan_github_repo
            - scan_docker_image
